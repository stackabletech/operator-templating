---
fail_fast: false

default_language_version:
  node: system

repos:
  - repo: https://github.com/crate-ci/typos
    # NOTE (@Techassi): As of 2026-11-03, 1.52.0 isn't yet available in PyPi.
    # See https://github.com/crate-ci/typos/issues/1641
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b  # v1.51.1
    hooks:
      - id: typos
        # Drop the upstream default `--write-changes` so the hook only
        # reports failures instead of writing changes.
        # Keep `--force-exclude` so the excludes in typos.toml still
        # apply to the paths prek passes in.
        args: ["--force-exclude"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # 6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # 1.38.0
    hooks:
      - id: yamllint
        args: ["--strict"]
        types: [text]
        files: \.(yml|yaml)(\.j2)*$

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f # 0.50.0
    hooks:
      - id: markdownlint
        types: [text]
        files: \.md(\.j2)*$

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: 99470f5e12208ff0fb17ab81c3c494f7620a1d8d # 0.11.0
    hooks:
      - id: shellcheck
        args: ["--severity=info"]

  # WARNING (@NickLarsenNZ): Nix users need to install ruff first.
  # If you do not, you will need to delete the cached ruff binary shown in the
  # error message
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # 0.17.3
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # 1.7.12
    hooks:
      - id: actionlint
        types: [text]
        files: ^(template/)?\.github/workflows/.*\.ya?ml(\.j2)?

  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505 # 2.15.1
    hooks:
      - id: hadolint
        exclude: \.j2$
